name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select an Xcode with Swift 6.1
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.4.app
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
